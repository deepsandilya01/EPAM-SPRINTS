[project]
name = "reflow"
version = "0.1.0"
description = "RE:Flow - Supply Chain Graph & Scenario Generator"
requires-python = ">=3.11"
dependencies = [
    "flask",
    "networkx",
    "pydantic",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    ".pytest_cache",
    ".git",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP006", "UP007", "UP035", "UP042", "UP045", "W293"]
