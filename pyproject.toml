[project]
name = "epam-sprints-supply-chain"
version = "1.0.0"
requires-python = ">=3.12"

[tool.vercel]
entrypoint = "backend.app:app"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    ".python",
    "__pycache__",
    ".pytest_cache",
    ".git",
    "reports",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP042", "W293"]

[tool.pyright]
extraPaths = ["backend"]
venvPath = "."
venv = ".venv"
