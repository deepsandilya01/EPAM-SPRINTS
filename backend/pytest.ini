# =============================================================================
# Project: RE:Flow
# Sprint: 1
# File: backend/pytest.ini
#
# Primary Owner: Shanu
# Role: Automated Testing and Integration Testing
#
# Purpose:
# Pytest configuration, test discovery paths, and test marker definitions.
#
# Responsibilities:
# - Maintain testpaths pointing to tests directory.
# - Define standard markers: unit, integration, performance, regression.
# - Configure strict markers and verbose output.
#
# Deliverables:
# - Working pytest configuration file.
#
# Status: NOT STARTED
# =============================================================================

[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast unit tests for graph validation and data integrity
    integration: Integration tests with backend app and live graph endpoints
    performance: Traversal performance and benchmark assertions
    regression: Regression tests ensuring previous bugfixes and behavior
