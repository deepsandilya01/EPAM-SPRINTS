[pytest]
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers
markers =
    unit: Fast unit tests for graph validation and data integrity
    integration: Integration tests with Flask app and live graph endpoints
    performance: Traversal performance and benchmark assertions
    regression: Regression tests ensuring previous bugfixes and behavior

